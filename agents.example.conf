# Example settings for a project using Cleared.
# Copy into <project>/.cleared/agents.conf and adjust models, paths, statuses,
# and account identifiers for that project.
# Commit [guard] salt in the project config when using fingerprint lists.

[models]
haiku       = claude:claude-haiku-4-5-20251001
sonnet-5.5  = claude:claude-sonnet-5-5
opus-5.5    = claude:claude-opus-5-5
fable-5.1   = claude:claude-fable-5-1
codex       = codex:gpt-6-luna
codex-heavy = codex:gpt-6.1-sol
gpt-6-sol   = codex:gpt-6-sol

[fallbacks]
haiku       = sonnet-5.5
sonnet-5.5  = opus-5.5
opus-5.5    = sonnet-5.5
fable-5.1   = opus-5.5
codex       = haiku
codex-heavy = gpt-6-sol
gpt-6-sol   = sonnet-5.5

[roles]
dev        = opus-5.5
review     = opus-5.5
release    = opus-5.5
triage     = haiku
cleanup    = haiku
mechanical = codex
writing    = fable-5.1
digest     = fable-5.1
talk       = opus-5.5

[rules]
dev label=Bug                                   -> opus-5.5
dev project="Backend reliability"                -> opus-5.5
dev path=api/                                -> opus-5.5
dev label=Feature path=web/ pr_lines>400   -> opus-5.5
dev label=Feature path=web/                -> sonnet-5.5
dev label=Feature project="Interface refresh"  -> sonnet-5.5
mechanical pr_lines>400                         -> codex-heavy

[policy]
guard_refusal = stop

[lead]
role = release
live = yes
wake_on = comment, lane_report, pr_checks, pr_merged, review_done, ticket_moved, night_check_failed
night_checks_event = schedule, workflow_dispatch
night_ticket = Infrastructure | Bug
not_lanes = scratch
terminals_kept = 3
max_minutes = 20
name = project lead
report_on = EX-1
report_hours = 6
messages_per_lane_per_hour = 6

[review]
differs_from_author = yes
when_same           = sonnet-5.5
author_role         = dev
per_hour            = 8

[merge]
tooling_paths =
guarded_paths = .cleared/, .github/, compose, Dockerfile, docs/decisions.md, docs/lane-rules.md, CLAUDE.md, ops/cleared/, test/flow.test.ts
code_paths = api/, web/, shared/

verdict = no blocking issues
lines_until =
separate_identity = required
queue_hours = 24
queue_max_attempts = 30

# Release monitoring is optional. Set one health probe before enabling it.
[release]
health_url =
health_command =
watch_minutes = 15
deploy_grace_minutes = 5
failures_to_rollback = 3
auto_rollback = false
reopen_state = Todo
migration_paths = db/migrations/, schema/

# The fast lane is optional and off by default (docs/fast-lane.md): a short
# circuit for a tiny, explicit change that the rules accept from its diff.
# Its settings are read from the main checkout, never from a pull request.
[fast_lane]
enabled = no
# A label or project counts only when the user set it (the tracker's history
# says who), and only when the tracker can tell him from an agent ([merge]
# separate_identity: an application of the agents, not a personal key).
# yes: also when the tracker cannot say; never against an agent it names.
labels = Quick
projects =
trust_label_without_actor = no
author_model = haiku
review_model = sonnet-5.5
# "*" and "**" never match a name that starts with a dot (docs/.env); name a
# dot directory explicitly to allow it (web/.well-known/*.txt).
safe_paths = docs/, web/src/locales/*.json, web/src/**/*.css
# Every file whose words carry an obligation: legal, consent, pricing, payment.
never_paths = web/src/auth/, api/, docs/legal/, web/src/locales/*legal*, web/src/locales/*consent*, web/src/locales/*pricing*, web/src/**/consent*.css
# The file types a fast change may touch; this can only narrow the built-in
# list (md, markdown, txt, css, json, po). Empty: that list.
file_types =
# Dangerous: types added at the project's own risk. Never one that runs, is
# interpreted or configures something (sh, js, ts, py, mdx, html, svg, yaml...).
extra_file_types =
# Literal texts no gained line may hold, on top of the built-in content rule.
forbidden_text =
dependency_files =
max_lines = 40
max_files = 10
max_file_bytes = 100000
# Runs with no shell: {files} becomes the changed files, one argument each.
# --passWithNoTests: a change no test relates to (docs only) passes instead of failing.
tests_command = npx --no-install vitest related --run --passWithNoTests {files}
tests_timeout_minutes = 10
# The one capture before and after; needs [lanes] kept_from and kept_in.
capture_screen = /settings

# Optional push heartbeat. Create URLs in your chosen monitoring service.
[heartbeat]
ping_url =
fail_url =
# Use URL files outside the repository when the monitoring URLs are secret.
ping_url_file =
fail_url_file =
timeout_secs = 10
# Optional endpoint used to check quota API reachability, if your provider has one.
quota_url =
quota_url_file =
wake_interval_minutes = 1
pending_minutes = 30
service_minutes = 10
lane_idle_minutes = 120
orphan_hours = 6
# Optional: Unix UID authorized to run status --reap (required outside the local tracker).
reap_owner_uid =

[limits]
max_lanes = 3
counted_roles = dev mechanical
subscription_stop = 90
subscription_switch = 80
ticket_cost_usd = 30
cli_max_days_behind = 14

[guard]
salt = cleared-example-only
terms   = scripts/private-terms.json
allowed = scripts/codex-guard-allow.json
# Comma-separated literal token prefixes specific to this project.
token_patterns = ex_live_

# Memory is opt-in. The four paths are relative to the project checkout.
[memory]
enabled = false
budget = 12000
# budget_dev = 16000
decisions = docs/decisions/
glossary = docs/glossary.md
project = docs/project.md
lessons = .cleared/prompts/<role>/lessons.md

[update]
self = yes
project = yes

[harness]
dev        = codex-heavy
mechanical = sonnet-5.5

[lanes]
root = ~/work/example-lanes/example
base = origin/main
push_roles = dev mechanical talk
todo_since =
runs_per_day = 12
session_hours = 6
base_without_model = yes
rerun_steps =
kept_from = .local/captures-tracker
kept_in = ~/work/example/.local/captures-tracker
tidy_hour = 6
idle_hours = 24
trial_prefixes = test/, trial/
busy_states = In Progress
closed_states = Done, Canceled, Duplicate
archives = .local/lane-archives
tidy_reason_live = change shipped
tidy_reason_idle = idle for a day, no open ticket
tidy_reason_trial = trial team
tidy_reason_waiting = waiting for approval
tidy_summary = %s team(s) remaining, %s model session(s) active.

[owner]
name =
language = en

[tracker]
adapter = linear
team = EX
# For GitHub Issues, replace adapter above and configure these project values:
# repository = example-org/example-repo
# app_login = sample-app[bot]
# app_id = 123456
# installation_id = 789012
# app_private_key_file = /home/cleared/.config/cleared/sample-app.pem
create_project = Example Service
create_label = Task
writeup_role = writing
writeup_for  = dev mechanical release triage cleanup
comments_per_hour = 6
owner_id =
validate_state = Needs Approval
go_state       = Ready to Ship
done_state     = Done
progress_state = In Progress
review_state   = In Review
todo_state     = Todo
capture_roots = ~/work/example/.local/captures-tracker, ~/work/example/.local/captures-tracker/*, ~/work/example-lanes/example/*/.local/captures-tracker

[forge]
# adapter = github
# Pull requests, pushes, merges and the dispatcher's commits go through the
# GitHub CLI and git credentials of the service account unless a GitHub App
# is configured here, or the GitHub Issues app of [tracker] is lent to the
# forge with use_tracker_app = yes (see docs/configuration.md#forge).
# use_tracker_app = yes
# app_id = 123456
# installation_id = 789012
# app_private_key_file = /home/cleared/.config/cleared/sample-app.pem
# app_login = sample-app[bot]
# app_user_id = 41898282
# A service on GitLab instead: the lock (merge-pr.ts) reads and merges its
# merge requests through GitLab's REST API, with the same checks, and never
# calls gh. The token file holds a personal access token with the api scope,
# mode 600, outside the checkout; no GitHub App key goes with it.
# adapter = gitlab
# gitlab_url = https://gitlab.com
# gitlab_project = group/name
# gitlab_token_file = /home/cleared/.config/cleared/forge-gitlab.token

[talk]
role = talk

[dashboard]
timezone       = UTC
timezone_label = UTC
warn_days      = 10

[subscriptions]
codex  =
claude = ongoing

[prices]
claude-haiku-4-5-20251001 = 1 5 0.10 1.25 2
claude-sonnet-5-5         = 2 10 0.20 2.5 4
claude-opus-5-5           = 4 20 0.20 5 8
claude-fable-5-1          = 10 50 0.25 12.5 20

[currency]
usd_eur = 0.8874

# The read-only Cleared app (Cockpit). `cleared app` starts it; the installer registers it.
[app]
bind = 127.0.0.1
# Never 80 or 443, which belong to the machine's public proxy: serve/install.ts refuses them, and any port in use.
# 8788 is the v1 app's port only: the Cleared v2 service never uses it (v2/README.md).
port = 8788
# For the gestures (docs/app.md), the https address of the app with its port, never 443:
# public_origin = https://<machine>.<tailnet>.ts.net:8443   (tailscale serve --bg --https=8443 http://127.0.0.1:8788)
# Peers allowed to connect; the default is Tailscale and this machine.
ranges =
# Extra host names the browser may use besides addresses, localhost and *.ts.net.
hosts =
# Private file (mode 0600, outside the project) holding the access token; created on first start.
token_file =
# Notifications to the human's phone (docs/notifications.md). Secrets (Web Push keys, the browsers'
# subscriptions, the ntfy, Telegram and e-mail credentials) never go here: they live in secrets_dir.
# The service's own settings (the link's address, the extra push hosts, the mail program) are not
# here either: a project's agent could change them. They are CLEARED_NOTIFY_LINK_BASE,
# CLEARED_NOTIFY_PUSH_HOSTS and CLEARED_NOTIFY_SENDMAIL, in the service's environment.
[notify]
# webpush (through the app, the default), ntfy, email, telegram; several separated by commas; none turns them off.
adapters         = webpush
# The events that notify; leave one out to turn it off.
events           = approval, question, rollback, health, blocked
# Quiet hours, on the clock of timezone; rollback and health still go through. Empty: none.
quiet_hours      =
timezone         =
# At most one notification per ticket in this many minutes.
coalesce_minutes = 10
# A team blocked this long is worth a notification.
blocked_minutes  = 30
# Private directory (mode 0700, outside the project); empty: ~/.config/cleared/notify.
secrets_dir      =
# Contact the push services may use (mailto: or https:); empty: the link address when it is https.
vapid_subject    =

[security]
agent_user =
human_user =
allow_shared_uid = false
socket_path =
bwrap_path = /usr/bin/bwrap
# Create this account explicitly on the server, then grant the service account
# passwordless sudo only for launching Claude and Codex as this account.
# agent_user = cleared-agents
# socket_path = /srv/cleared-run/release.sock
