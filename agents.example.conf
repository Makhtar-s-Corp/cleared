# Example settings for a project using Cleared.
# Copy into <project>/.cleared/agents.conf and adjust models, paths, statuses,
# permissions, and account identifiers for that project.
# Commit [guard] salt in the project config when using fingerprint lists.

[models]
haiku       = claude:claude-haiku-4-5-20251001
sonnet-5.5  = claude:claude-sonnet-5-5
opus-5.5    = claude:claude-opus-5-5
fable-5.1   = claude:claude-fable-5-1
codex       = codex:gpt-6-luna
codex-heavy = codex:gpt-6.1-sol
gpt-6-sol   = codex:gpt-6-sol

[fallbacks]
haiku       = sonnet-5.5
sonnet-5.5  = opus-5.5
opus-5.5    = sonnet-5.5
fable-5.1   = opus-5.5
codex       = haiku
codex-heavy = gpt-6-sol
gpt-6-sol   = sonnet-5.5

[roles]
dev        = opus-5.5
review     = opus-5.5
release    = opus-5.5
triage     = haiku
cleanup    = haiku
mechanical = codex
writing    = fable-5.1
digest     = fable-5.1
talk       = opus-5.5

[rules]
dev label=Bug                                   -> opus-5.5
dev project="Backend reliability"                -> opus-5.5
dev path=api/                                -> opus-5.5
dev label=Feature path=web/ pr_lines>400   -> opus-5.5
dev label=Feature path=web/                -> sonnet-5.5
dev label=Feature project="Interface refresh"  -> sonnet-5.5
mechanical pr_lines>400                         -> codex-heavy

[policy]
guard_refusal = stop

[lead]
role = release
live = yes
wake_on = comment, lane_report, pr_checks, pr_merged, review_done, ticket_moved, night_check_failed
night_checks_event = schedule, workflow_dispatch
night_ticket = Infrastructure | Bug
not_lanes = scratch
terminals_kept = 3
max_minutes = 20
name = project lead
report_on = EX-1
report_hours = 6
messages_per_lane_per_hour = 6

[review]
differs_from_author = yes
when_same           = sonnet-5.5
author_role         = dev
per_hour            = 8

[merge]
tooling_paths =
guarded_paths = .cleared/, .github/, compose, Dockerfile, docs/decisions.md, docs/lane-rules.md, CLAUDE.md, ops/cleared/, test/flow.test.mjs
code_paths = api/, web/, shared/

verdict = no blocking issues
lines_until =
separate_identity = required
queue_hours = 24
queue_max_attempts = 30

# Release monitoring is optional. Set one health probe before enabling it.
[release]
health_url =
health_command =
watch_minutes = 15
deploy_grace_minutes = 5
failures_to_rollback = 3
auto_rollback = false
reopen_state = Todo
migration_paths = db/migrations/, schema/

# Optional push heartbeat. Create URLs in your chosen monitoring service.
[heartbeat]
ping_url =
fail_url =
# Use URL files outside the repository when the monitoring URLs are secret.
ping_url_file =
fail_url_file =
timeout_secs = 10
# Optional endpoint used to check quota API reachability, if your provider has one.
quota_url =
quota_url_file =
wake_interval_minutes = 1
pending_minutes = 30
service_minutes = 10
lane_idle_minutes = 120
orphan_hours = 6
# Optional: Unix UID authorized to run status --reap (required outside the local tracker).
reap_owner_uid =

[limits]
max_lanes = 3
counted_roles = dev mechanical
subscription_stop = 90
subscription_switch = 80
ticket_cost_usd = 30
cli_max_days_behind = 14

[guard]
salt = cleared-example-only
terms   = scripts/private-terms.json
allowed = scripts/codex-guard-allow.json
# Comma-separated literal token prefixes specific to this project.
token_patterns = ex_live_

# Memory is opt-in. The four paths are relative to the project checkout.
[memory]
enabled = false
budget = 12000
# budget_dev = 16000
decisions = docs/decisions/
glossary = docs/glossary.md
project = docs/project.md
lessons = .cleared/prompts/<role>/lessons.md

[update]
self = yes
project = yes

[harness]
dev        = codex-heavy
mechanical = sonnet-5.5

[lanes]
root = ~/work/example-lanes/example
base = origin/main
push_roles = dev mechanical talk
todo_since =
runs_per_day = 12
session_hours = 6
base_without_model = yes
rerun_steps =
kept_from = .local/captures-tracker
kept_in = ~/work/example/.local/captures-tracker
heavy_commands = npm run test:ui, npm run capture:all, npm run capture:landing, ~/work/example/scripts/run-codex-task.sh
heavy_wait_minutes = 30
tidy_hour = 6
idle_hours = 24
trial_prefixes = test/, trial/
busy_states = In Progress
closed_states = Done, Canceled, Duplicate
archives = .local/lane-archives
tidy_reason_live = change shipped
tidy_reason_idle = idle for a day, no open ticket
tidy_reason_trial = trial team
tidy_reason_waiting = waiting for approval
tidy_summary = %s team(s) remaining, %s model session(s) active.

# Where the sessions run: orca (a terminal of Orca per session) or none (no
# terminal: detached, their output in terminal.log of their run folder).
[terminal]
adapter = orca

[owner]
name =
language = en

[tracker]
adapter = linear
team = EX
# For GitHub Issues, replace adapter above and configure these project values:
# repository = example-org/example-repo
# app_login = sample-app[bot]
# app_id = 123456
# installation_id = 789012
# app_private_key_file = /home/cleared/.config/cleared/sample-app.pem
create_project = Example Service
create_label = Task
writeup_role = writing
writeup_for  = dev mechanical release triage cleanup
comments_per_hour = 6
owner_id =
validate_state = Needs Approval
go_state       = Ready to Ship
done_state     = Done
progress_state = In Progress
review_state   = In Review
todo_state     = Todo
capture_roots = ~/work/example/.local/captures-tracker, ~/work/example/.local/captures-tracker/*, ~/work/example-lanes/example/*/.local/captures-tracker

[forge]
adapter = github
# Pull requests, pushes, merges and the dispatcher's commits go through the
# GitHub CLI and git credentials of the service account unless a GitHub App
# is configured here, or the GitHub Issues app of [tracker] is lent to the
# forge with use_tracker_app = yes (see docs/configuration.md#forge).
# use_tracker_app = yes
# app_id = 123456
# installation_id = 789012
# app_private_key_file = /home/cleared/.config/cleared/sample-app.pem
# app_login = sample-app[bot]
# app_user_id = 41898282

[permissions.dev]
mode  = accept-edits
# Local test databases use TCP; enabling this also permits other network destinations.
network = yes
allow = npm test, npm run test:calculations, npm run test:dates, npm run test:docs, npm run test:mutations, {orch}/when-free.sh, npm run check, npm run build, node --test, node scripts/with-test-postgres.mjs -- node --test, git status, git diff, git log, git show, git add, git commit, git restore, git merge, git rev-parse, git ls-files, git blame
deny  = curl, wget, ssh, scp, nc, docker, npm run docker:up, npm install, npm ci, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh, npm run test:ui, npm run capture:all, npm run capture:landing

[permissions.mechanical]
mode  = accept-edits
# Local test databases use TCP; enabling this also permits other network destinations.
network = yes
allow = npm test, npm run test:calculations, npm run test:dates, npm run test:docs, npm run test:mutations, npm run test:ui, npm run check, npm run build, node --test, node scripts/with-test-postgres.mjs -- node --test, git status, git diff, git log, git show, git add, git commit, git restore, git merge, git rev-parse, git ls-files, git blame
deny  = curl, wget, ssh, scp, nc, docker, npm run docker:up, npm install, npm ci, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[permissions.release]
mode  = read-only
network = no
advisor = no
allow = git status, git diff, git log, git show, git rev-parse, git ls-files
deny  = curl, wget, ssh, scp, nc, docker, npm, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[permissions.release-live]
mode  = read-only
network = yes
# The model asks the broker; it receives no state or main-checkout write grant.
read  = {kept}
advisor = no
allow = {orch}/lead-command.mjs, {orch}/release-request.mjs, git status, git diff, git log, git show, git rev-parse, git ls-files
deny  = {orch}/tracker.sh move, *--output*, *--no-index*, curl, wget, ssh, scp, nc, docker, npm, npx, gh, orca, git push, git fetch, git pull, git clone, git remote, {orch}/tidy-lanes.sh, {orch}/spawn-lane.sh, {orch}/kill-lane.sh, {orch}/push-lane.sh, {orch}/adopt-lane.sh, {orch}/confirm-decision.sh

[talk]
role = talk

[permissions.talk]
mode  = read-only
network = yes
write = {state}
allow = {orch}/decide.sh, {orch}/tracker.sh issue, {orch}/tracker.sh comments, {orch}/tracker.sh list, {orch}/tracker.sh waiting, {orch}/host-state.sh, {orch}/tell-lane.sh --list, git status, git log, git show, git ls-files
deny  = *--output*, *--no-index*, curl, wget, ssh, scp, nc, docker, npm, npx, gh, orca, git push, git fetch, git pull, git clone, git remote, git commit, git merge, git reset, git checkout, {orch}/confirm-decision.sh, {orch}/tracker.sh comment, {orch}/tracker.sh create, {orch}/spawn-lane.sh, {orch}/kill-lane.sh, {orch}/push-lane.sh, {orch}/adopt-lane.sh, {orch}/talk.sh, {orch}/wake.sh

[permissions.review]
mode  = read-only
network = no
allow = git status, git diff, git log, git show, git rev-parse, git ls-files, git blame
deny  = *--output*, *--no-index*, curl, wget, ssh, scp, nc, docker, npm, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[permissions.triage]
mode = read-only
network = no
allow = git status, git diff, git log, git show
deny = curl, wget, ssh, scp, nc, docker, npm, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[permissions.cleanup]
mode = read-only
network = no
allow = git status, git diff, git log, git show
deny = curl, wget, ssh, scp, nc, docker, npm, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[permissions.writing]
mode = read-only
network = no
deny = curl, wget, ssh, scp, nc, docker, npm, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[permissions.digest]
mode = read-only
network = no
deny = curl, wget, ssh, scp, nc, docker, npm, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[adapter.claude]
package    = @anthropic-ai/claude-code
connectors = none
process    = claude
deny_tools = WebFetch WebSearch

[adapter.codex]
package     = @openai/codex
process     = codex
runner      = host
# The following settings apply only when runner = container.
task_script = ~/work/example/scripts/run-codex-task.sh
task_tools  = yes
commits     = no

[dashboard]
timezone       = UTC
timezone_label = UTC
warn_days      = 10

[subscriptions]
codex  =
claude = ongoing

[prices]
claude-haiku-4-5-20251001 = 1 5 0.10 1.25 2
claude-sonnet-5-5         = 2 10 0.20 2.5 4
claude-opus-5-5           = 4 20 0.20 5 8
claude-fable-5-1          = 10 50 0.25 12.5 20

[currency]
usd_eur = 0.8874

# The read-only Cleared app (Cockpit). `cleared app` starts it; the installer registers it.
[app]
bind = 127.0.0.1
port = 8788
# Peers allowed to connect; the default is Tailscale and this machine.
ranges =
# Extra host names the browser may use besides addresses, localhost and *.ts.net.
hosts =
# Private file (mode 0600, outside the project) holding the access token; created on first start.
token_file =
[security]
agent_user =
human_user =
allow_shared_uid = false
socket_path =
bwrap_path = /usr/bin/bwrap
# Create this account explicitly on the server, then grant the service account
# passwordless sudo only for launching Claude and Codex as this account.
# agent_user = cleared-agents
# socket_path = /srv/cleared-run/release.sock
