# Cleared settings for the guestbook, the demo project of Cleared v2
# milestone 1 (docs/v2/milestone-1-plan.md, lane 3). The format and the keys
# of every section but [session] are v1's (docs/configuration.md);
# [session] is read by the v2 service only.

[tracker]
adapter = local
todo_state     = Todo
progress_state = In Progress
review_state   = In Review
validate_state = Needs Approval
go_state       = Ready to Ship
done_state     = Done
# agents_uid, owner_id and human_public_key are written at setup, on the
# machine that runs the demo: the v2 service's account and the owner's key
# are not known here (milestone 1 plan, lane 8).

[merge]
tooling_paths = package-lock.json
guarded_paths = .cleared/, .github/, .devcontainer/, deploy/, Dockerfile
code_paths = src/, test/
verdict = no blocking issues

# The deploy watcher (deploy/watch.ts) serves the base branch on this
# address. A window short enough for a demo that shows a rollback: the
# release watch probes every 30 seconds from minute 2 to minute 5 and reverts
# the merge after two failed probes in a row. The grace covers the watcher's
# 30-second poll plus its build and start, measured at 4 seconds at most
# (docs/v2/decisions-log.md in the Cleared repository), so the first probe
# reaches the merged version, not the one before it.
[release]
health_url = http://127.0.0.1:8793/health
watch_minutes = 5
deploy_grace_minutes = 2
failures_to_rollback = 2
auto_rollback = true
reopen_state = Todo

# Agents run in containers in v2: no agent shares the service's account, so
# the broker's shared-UID refusal has nothing to protect here (plan, decision 7).
[security]
allow_shared_uid = true

# No private-term list for a public demo: the secret patterns still apply.
[guard]
terms = none
allowed = none

# What the v2 service gives a session of this project.
#   image          the session image, when .devcontainer/devcontainer.json names none
#   services       test services started beside the session, separated by commas:
#                  an image, then its environment as NAME=value words; a service
#                  is reached by its image name without the tag (postgres)
#   env            environment of the session, NAME=value words
#   safe_commands  commands allowed without asking, added to Cleared's defaults
#   hosts          hosts the egress proxy lets through, added to the model API
#   test_command   the one command a reviewer runs, the service's tests (issue #268)
#   question_timeout_minutes  how long an agent's question waits before the Lead
#                  decides (the service's setting otherwise, 30 minutes by default)
#   question_default  what then applies if nobody answers: recommended (the
#                  default), first (the recommended option, else the first) or park
[session]
image = cleared-v2-session:latest
services = postgres:16 POSTGRES_HOST_AUTH_METHOD=trust
env = DATABASE_URL=postgres://postgres@postgres:5432/postgres
safe_commands = npm ci, npm test, npm run typecheck
test_command = npm test
hosts = registry.npmjs.org
