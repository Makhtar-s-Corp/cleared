name: checks

# The filter API's tests and types, on every pull request to main and every
# push to it. No service container: the filter API has no database.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commits: actions/checkout v4.4.0 and actions/setup-node v4.4.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Types
        run: npm run typecheck
