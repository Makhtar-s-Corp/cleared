# Cleared settings for the filter API, the second demo project of Cleared v2
# milestone 2 (docs/v2/milestone-2-plan.md in the Cleared repository, lane
# 28): the service the guestbook consumes in the multi-service proof. The
# format and the keys of every section but [session] are v1's
# (docs/configuration.md); [session] is read by the v2 service only.

[tracker]
adapter = local
todo_state     = Todo
progress_state = In Progress
review_state   = In Review
validate_state = Needs Approval
go_state       = Ready to Ship
done_state     = Done
# agents_uid, owner_id and human_public_key are written at setup, on the
# machine that runs the demo.

[merge]
tooling_paths = package-lock.json
guarded_paths = .cleared/, .github/, .devcontainer/, deploy/, Dockerfile
code_paths = src/, test/, contract/, words.txt
verdict = no blocking issues

# The deploy watcher (deploy/watch.ts) serves the base branch on this
# address. The guestbook's window: the release watch probes every 30 seconds
# from minute 2 to minute 5 and reverts the merge after two failed probes in
# a row. The grace covers the watcher's 30-second poll plus its build and
# start; the image has no RUN step, so its build is shorter than the
# guestbook's.
[release]
health_url = http://127.0.0.1:8795/health
watch_minutes = 5
deploy_grace_minutes = 2
failures_to_rollback = 2
auto_rollback = true
reopen_state = Todo

# Agents run in containers in v2: no agent shares the service's account.
[security]
allow_shared_uid = true

# No private-term list for a public demo: the secret patterns still apply.
[guard]
terms = none
allowed = none

# What the v2 service gives a session of this project. No test service: the
# filter API has no database.
#   image          the session image, when .devcontainer/devcontainer.json names none
#   safe_commands  commands allowed without asking, added to Cleared's defaults
#   hosts          hosts the egress proxy lets through, added to the model API
#   test_command   the one command a reviewer runs, the service's tests (issue #268)
[session]
image = cleared-v2-session:latest
safe_commands = npm ci, npm test, npm run typecheck
test_command = npm test
hosts = registry.npmjs.org
