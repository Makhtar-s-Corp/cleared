# The workspace of Cleared v2's multi-service proof (docs/v2/milestone-2-plan.md,
# section 2.2, decisions 18 and 21): the guestbook, which consumes, and the
# filter API, which provides. The v2 service reads it when
# CLEARED_V2_WORKSPACE names it; the format is agents.conf's (sections,
# key = value, # comments).
#
# The id is the project value of the guestbook's rows in the ledger, so its
# tickets stay in this workspace: "guestbook" as the rehearsals and the tests
# name it. A server whose CLEARED_V2_PROJECT says another name puts that name
# here in its own copy.
#
# "example-org" stands for the organisation the two example repositories
# live in, and the broker paths are a proposal: the copy on the server that
# runs the proof names the organisation and its own paths.
[workspace]
id = guestbook
name = Guestbook and filter API

# Keys of a service (decisions 18, 20, 21 and 24 of the plan):
#   kind           repository, or folder (a folder of a monorepo, with path)
#   repository     owner/name on the forge
#   url            the clone address
#   base           the base branch
#   path           the folder, for kind = folder only
#   health_url     what the release watch probes after a merge
#   sensitivity    normal, full, reviewer:<model> or human:<user>
#   consumes       the services it calls, separated by commas
#   run            the Dockerfile that builds it and the port it listens on
#   contract       openapi:<path of its OpenAPI 3 file in the repository>
#   broker_socket  the socket of this service's release broker
#   broker_state   the state folder of this service's release broker
# A service with a contract and no run is a fake in a trial; a service that
# consumes another is landed after it, and rolled back before it.

[service guestbook]
kind = repository
repository = example-org/cleared-example-guestbook
url = https://github.com/example-org/cleared-example-guestbook.git
base = main
health_url = http://127.0.0.1:8793/health
sensitivity = normal
consumes = filter-api
run = Dockerfile 8793
broker_socket = /run/user/1000/cleared-v2/guestbook/broker.sock
broker_state = /var/lib/cleared-v2/brokers/guestbook

[service filter-api]
kind = repository
repository = example-org/cleared-example-filter-api
url = https://github.com/example-org/cleared-example-filter-api.git
base = main
health_url = http://127.0.0.1:8795/health
sensitivity = normal
run = Dockerfile 8795
contract = openapi:contract/openapi.yaml
broker_socket = /run/user/1000/cleared-v2/filter-api/broker.sock
broker_state = /var/lib/cleared-v2/brokers/filter-api
