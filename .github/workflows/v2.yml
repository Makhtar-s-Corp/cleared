name: v2

# The checks of the v2 service (v2/). They run on pushes to the v2 branch and
# on pull requests to it; checks.yml keeps checking the v1 code on every pull request.
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Types
        run: npx tsc --noEmit
      - name: Private terms and secrets guard
        # github.base_ref is empty on a push. A push checks from the commit before it, or from HEAD~1 when that
        # commit is all zeros (a new branch). The checkout has fetch-depth 0, so the commit is present.
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1') }}
        run: npm run guard -- --base "$GUARD_BASE"
