name: checks

# The checks of the tool itself. They run on a machine of the forge, never on
# the host of a project the tool works on: a screen test of that project must
# not be slowed down by them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The v1 core is TypeScript run by Node itself; the type check uses the
      # TypeScript and Node types v2/ installs (no install script runs).
      - name: Types
        env:
          SCARF_ANALYTICS: 'false'
          DO_NOT_TRACK: '1'
        run: |
          npm ci --prefix v2 --ignore-scripts
          v2/node_modules/.bin/tsc -p .
      - name: Syntax of the browser's scripts
        run: |
          for script in app/public/*.js; do node --check "$script"; done
      - name: Tests
        run: node --no-warnings --test --test-timeout=120000 test/*.test.ts
