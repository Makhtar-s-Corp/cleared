# Route of the Coolify proxy (Traefik, file provider) to the static dashboard.
# Private: the host name resolves to the Tailscale address of the server, and
# the route refuses any source outside the Tailscale network, like the
# existing openclaw-tailscale-only.yaml.
#
# serve/install.sh fills in the addresses and says what to copy where.
http:
  middlewares:
    orchestration-tailscale-only:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"
          - "fd7a:115c:a1e0::/48"
  routers:
    orchestration-dashboard:
      entryPoints:
        - http
      rule: 'Host(`orchestration.TAILSCALE_IP.sslip.io`)'
      priority: 20000
      middlewares:
        - orchestration-tailscale-only
      service: orchestration-dashboard
  services:
    orchestration-dashboard:
      loadBalancer:
        servers:
          - url: 'http://@BIND@:@PORT@'
