# Routing table of the agent dispatcher (SEE-112).
#
# Changing a model = changing one line here. No script names a model or a
# provider: the dispatcher only knows aliases, and an adapter per CLI
# (adapters/<name>.sh) knows how to talk to its own backend.
#
# A new provider = one adapter file + one line in [models].
#
# Starting table: only the models that answered from this server on
# 2026-10-07 are listed. To be adjusted with the costs measured in the ledger.

[models]
# alias = adapter:model id, exactly as the CLI takes it
haiku       = claude:claude-haiku-4-5-20251001
sonnet-5.5  = claude:claude-sonnet-5-5
opus-5.5    = claude:claude-opus-5-5
fable-5.1   = claude:claude-fable-5-1
codex       = codex:gpt-5.6-luna
gpt-5.6-sol = codex:gpt-5.6-sol

[fallbacks]
# alias = alias tried next when the first one is unavailable or refuses to
# start. A fallback is always written to the ledger and to the Linear comment
# of the lane; a chain that ends without a usable model is an error.
haiku       = sonnet-5.5
sonnet-5.5  = opus-5.5
opus-5.5    = sonnet-5.5
fable-5.1   = opus-5.5
codex       = haiku
gpt-5.6-sol = opus-5.5

[roles]
# Level 1: the default model of each role.
dev        = opus-5.5
review     = opus-5.5
release    = haiku
triage     = haiku
cleanup    = haiku
mechanical = codex
# Anything a human reads: Linear report, release notes, interface copy, and
# the daily digest (its figures come from SQL, the model only words them).
writing    = fable-5.1
digest     = fable-5.1

[rules]
# Level 2: overrides by kind of task, read from the Linear ticket and, once a
# pull request exists, from its size and the paths it touches.
#
#   <role> <condition> [<condition>...] -> <alias>
#
# The first matching line wins; every condition of a line must hold.
# Conditions: label=, project=, path= (a touched path starts with it),
# pr_lines> / pr_lines<. A condition on something not known yet (no pull
# request at spawn time) does not match.
dev label=Bug                                   -> opus-5.5
dev project="Justesse du moteur"                -> opus-5.5
dev path=server/                                -> opus-5.5
dev label=Feature path=frontend/ pr_lines>400   -> opus-5.5
dev label=Feature path=frontend/                -> sonnet-5.5
# At spawn time no path is known: the project stands in for frontend/.
dev label=Feature project="Refonte des écrans"  -> sonnet-5.5

[review]
# A pull request is never reviewed by the model that wrote it. This replaces
# the rule of 2026-10-05 ("no Codex review"): the reviewer is whatever this
# file says. To let another provider review, point when_same (or the review
# role) to its alias, for instance gpt-5.6-sol.
differs_from_author = yes
when_same           = sonnet-5.5

[limits]
# Lanes opened by the dispatcher (branches <role>/<ticket>) running at once.
max_lanes = 3

[lanes]
# Where the dispatcher creates its worktrees, and from which ref.
root = ~/orca-workspaces/budgeting-lanes/budgeting
base = origin/main

[linear]
team = SEE
# Role that words the Linear comment of a lane from its report. Empty = the
# report is posted as the lane wrote it.
writeup_role = writing

[adapter.claude]
# Empty = the permission mode of the user's own Claude Code settings.
permission_mode =

[adapter.codex]
# Codex never runs on the host: this trusted script (main checkout) runs it
# in a container that only sees a guarded snapshot of the commit.
task_script = ~/orca-workspaces/budgeting/scripts/codex-task.sh

[dashboard]
# Times on the page are written in this zone (the page has no script).
timezone       = Europe/Istanbul
timezone_label = heure d'Istanbul
# A subscription is flagged when it ends within this many days.
warn_days      = 10

[subscriptions]
# name = end date (YYYY-MM-DD). Shown with the days left on the dashboard and
# recalled by the daily digest. Empty = end date not known.
codex  = 2026-10-16
claude =

[prices]
# USD per million tokens: input, output, cache read, cache write 5 min,
# cache write 1 h. Used when the CLI does not report a cost itself (old
# session logs). No line = no cost computed, never a guess.
# The 1 h write rate was checked against the cost reported by the CLI on
# 2026-10-07; the 5 min rate is the list rate (1.25 x input).
claude-haiku-4-5-20251001 = 1 5 0.10 1.25 2
claude-sonnet-5-5         = 2 10 0.20 2.5 4
claude-opus-5-5           = 4 20 0.20 5 8
claude-fable-5-1          = 10 50 0.25 12.5 20

[currency]
# Euros for one US dollar. ECB reference rate of 2026-10-06 (1 EUR = 1.1269 USD).
usd_eur = 0.8874
