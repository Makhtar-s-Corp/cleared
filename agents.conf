# Routing table of the agent dispatcher.
#
# Changing a model = changing one line here. No script names a model or a
# provider: the dispatcher only knows aliases, and an adapter per CLI
# (adapters/<name>.sh) knows how to talk to its own backend.
#
# A new provider = one adapter file + one line in [models].
#
# Starting table: only the models that answered from this server on
# 2026-10-07 are listed (the Codex ones on an empty tree, see README). To be adjusted with the costs measured in the ledger.

[models]
# alias = adapter:model id, exactly as the CLI takes it
haiku       = claude:claude-haiku-4-5-20251001
sonnet-5.5  = claude:claude-sonnet-5-5
opus-5.5    = claude:claude-opus-5-5
fable-5.1   = claude:claude-fable-5-1
# Codex: one model for volume, one for heavy mechanical work.
codex       = codex:gpt-6-luna
codex-heavy = codex:gpt-6.1-sol
gpt-6-sol   = codex:gpt-6-sol

[fallbacks]
# alias = alias tried next when the first one is unavailable or refuses to
# start. A fallback is always written to the ledger and to the Linear comment
# of the lane; a chain that ends without a usable model is an error.
haiku       = sonnet-5.5
sonnet-5.5  = opus-5.5
opus-5.5    = sonnet-5.5
fable-5.1   = opus-5.5
codex       = haiku
codex-heavy = gpt-6-sol
gpt-6-sol   = sonnet-5.5

[roles]
# Level 1: the default model of each role.
dev        = opus-5.5
review     = opus-5.5
# The project lead in short sessions. The most capable model, by decision of
# the user on 2026-10-07: tried with the smallest one, it ran 8 sessions in 20
# minutes once it acted and wrote 4 messages with wrong facts. Not to be tried
# again (ledger: role_model_changed).
release    = opus-5.5
triage     = haiku
cleanup    = haiku
mechanical = codex
# Anything a human reads: Linear report, release notes, interface copy, and
# the daily digest (its figures come from SQL, the model only words them).
writing    = fable-5.1
digest     = fable-5.1
# A conversation with the user (talk.sh): the quality of the exchange comes
# first, it is not a role to save on.
talk       = opus-5.5

[rules]
# Level 2: overrides by kind of task, read from the Linear ticket and, once a
# pull request exists, from its size and the paths it touches.
#
#   <role> <condition> [<condition>...] -> <alias>
#
# The first matching line wins; every condition of a line must hold.
# Conditions: label=, project=, path= (a touched path starts with it),
# pr_lines> / pr_lines<. A condition on something not known yet (no pull
# request at spawn time) does not match.
dev label=Bug                                   -> opus-5.5
dev project="Justesse du moteur"                -> opus-5.5
dev path=server/                                -> opus-5.5
dev label=Feature path=frontend/ pr_lines>400   -> opus-5.5
dev label=Feature path=frontend/                -> sonnet-5.5
# At spawn time no path is known: the project stands in for frontend/.
dev label=Feature project="Refonte des écrans"  -> sonnet-5.5
# Heavy mechanical work (mass migrations): by size once a pull request
# exists, or forced at spawn with --model codex-heavy.
mechanical pr_lines>400                         -> codex-heavy

[policy]
# What happens when the safeguard of a backend refuses the content of a task
# (exit code 3; for Codex, its guard found something it will not send out).
# stop: the lane ends there and says why. fallback: the next model of the
# chain takes the task. A backend that merely cannot start now (exit code 2:
# a CI run in progress, a missing script) always hands over to its fallback.
guard_refusal = stop

[lead]
# The project lead in short sessions: woken by wake.sh only when something
# moved (a comment or a ticket of the user, a pull request opened, made ready,
# merged or closed, its checks turning green or red). Its model is the one of
# this role.
role = release
# no: it observes. It reads what moved and writes what it would do, and does
# nothing: no comment, no lane, no merge.
# yes: it acts, within [permissions.<role>-live]. Decision of the user on
# 2026-10-07, once the old project lead had handed over and stopped. First
# step only: it answers, in Linear and to the lanes already at work.
live = yes
# What is worth a session by itself. The other events (a draft opened, a pull
# request made ready while its checks still run, one closed, a ticket filed)
# wait and are handed to the
# next session that one of these starts. Measured on 2026-10-07: 9 sessions of
# 15 had nothing to decide, 6 of them woken by one of those four. A merge
# stays: it is when the next lane is told to bring main in. Add ticket_new
# when the lead may open a lane.
wake_on = comment, lane_report, pr_checks, pr_merged, review_done, ticket_moved, night_check_failed
# The night checks: the kinds of run started on the base outside any pull
# request. On this host the timetable of the server starts them, as runs
# « started by hand » (workflow_dispatch); the forge starts some by itself
# too (schedule).
# Green, nothing is said and nobody is woken. Red, the lead is woken, opens a
# ticket (night_ticket: project | label) and keeps a note for the morning
# digest (rule of the user, 2026-10-08). Without night_checks_event they are
# not followed.
night_checks_event = schedule, workflow_dispatch
night_ticket = CI et infra | Bug
# Worktrees under the lanes root that are not lanes at work, besides the
# ones the dispatcher opens itself (a scratch folder, for example): the
# tidying leaves them alone.
not_lanes = scratch
# In its lane, one terminal a session: only the last ones stay open in Orca.
# What an older session said is in state/runs/ and in the ledger.
terminals_kept = 3
# A session still running after this many minutes no longer holds the next
# wake back.
max_minutes = 20
# How its comments are signed in Linear, and the ticket where it answers a
# handover (wake.sh --handover).
name = chef de projet
report_on = ABC-1
# The last message of a lane is a request to the lead for this many hours; an
# older one is left alone.
report_hours = 6
# No more messages than this from the lead to one lane in an hour: a lead and
# a lane answering each other in a loop would start a model at every turn.
messages_per_lane_per_hour = 6

[review]
# A pull request is never reviewed by the model that wrote it. This replaces
# the rule of 2026-10-05 ("no Codex review"): the reviewer is whatever this
# file says. To let another provider review, point when_same (or the review
# role) to its alias, for instance gpt-6-sol.
differs_from_author = yes
when_same           = sonnet-5.5
# Role whose last finished run on the ticket tells who wrote the pull request,
# when --author-model is not given.
author_role         = dev
# Reviews the project lead may open in an hour (review-pr.sh). Each one is a
# session of a model: a pull request is read once per commit, never twice.
per_hour            = 8

[merge]
# A go-live is done by merge-pr.sh, which checks and does not judge. Paths
# are prefixes, separated by commas.
# Invisible tooling: a pull request whose every file is under these ships
# once reviewed and green, without the user's statuses.
# Never without his own agreement, tooling or not (guarded_paths): the checks
# of the CI, the deployment, his written rules, and the lock of the go-lives
# itself. The lock is the script that puts live and everything it runs or
# reads to decide, down to what starts a reviewer and writes its report:
# followed far enough (three reviews, 2026-10-08), that is this whole folder,
# this file and their tests. A change there could open the lock by itself.
# So only what people read and no script or agent does ships by itself: the
# two manuals. The record of the decisions is not one of them: the prompts
# of the reviewer, of the lead and of the conversation give it to the agents
# as their rules. What ships by itself is named exactly (a file is that
# file, a name ending with a slash is a folder); what is guarded is a
# beginning. Of two that hold a file, the longer one says what it is.
tooling_paths = ops/orchestration/README.md, ops/orchestration/AUDIT.md
guarded_paths = .github/, compose, Dockerfile, docs/decisions.md, docs/regles-lanes.md, CLAUDE.md, ops/orchestration/, test/orchestration.test.mjs
# A branch may be behind the base only on what is not code.
code_paths = server/, frontend/, shared/
# What the reviewer must have concluded on the version that goes live.
verdict = rien de bloquant
# His lines « Fusion : <ticket> » count when written before this moment, the
# one his two statuses were created in Linear: Linear cannot tell him from a
# program acting under his account, and since then he agrees by a status.
lines_until = 2026-10-08T06:23:38Z
# No agreement is read from a tracker that cannot tell the user from an
# agent, that is when the scripts act under the key of a person and not
# under an application of their own (linear.sh identity). It is so without
# this line too; only « no » makes a project accept such a tracker.
separate_identity = required
# A go-live that only waits leaves the queue after this many hours, and the
# lead is told.
queue_hours = 24

[limits]
# Lanes opened by the dispatcher (branches <role>/<ticket>) running at once,
# and the roles whose lanes take one of those places. The others (the project
# lead's lane, a review) only read: they do not hold a place.
max_lanes = 3
counted_roles = dev mechanical
# The share of a window of the subscription (percent), as the sessions
# themselves say it, at or over which no lane opens until that window starts
# over. The lead keeps running, and tells the user once. Rule of the user of
# 9 October 2026: 80 in the morning, raised by him to 90 the same afternoon.
# Empty: no stop.
subscription_stop = 90
# At or over this share of a window, a subscription is tight: a lane whose
# role names another harness ([harness]) opens there, when that one's
# subscription is not tight itself. Below the stop, the tight one stays
# behind as a fallback; at the stop it is no fallback at all.
subscription_switch = 80
# What a ticket may cost, in dollars at list price, every run of it counted
# (the lane, its reviews, the write-ups). A session is given what is left and
# is stopped there; a lane at the cap is not opened again; the lead tells the
# user and asks whether to raise it. For one ticket, the user raises it by
# writing a line « Plafond : <amount> » on it. Rule of the user of 9 October
# 2026: 30. Empty: no cap.
ticket_cost_usd = 30
# A CLI this many days behind its latest release gets a line in the digest.
# Checked once a week.
cli_max_days_behind = 14

[guard]
# Whatever a script sends outside the machine (a comment, a ticket, a commit
# message, the lines a push adds) is read first by the guard of the tool
# (lib/guard/): a secret, an IBAN, an address, a phone number, a private term.
# The two lists it needs are the project's, as files of its repository, read
# from what is committed on the default branch of its remote, never from the
# files of a checkout, and never at a place a settings file names:
# terms    the fingerprints of its private terms (never the terms themselves);
# allowed  the fingerprints of values checked by hand as fictitious.
# Each names a file, or says « none ». A key left out is a refusal to send
# anything: a project is never unguarded by a typo. When the project carries
# its own settings (.ferme/agents.conf), these two are read from them as they
# are committed there.
terms   = scripts/private-terms.json
allowed = scripts/codex-guard-allow.json

[update]
# yes: the checkout the dispatcher runs from follows the base by itself, at
# each wake (self-update.sh): fast-forward only, never a copy somebody
# changed by hand, never a version whose scripts cannot be read. Without it,
# a change of the tooling that went live does not run until somebody pulls.
# base: the branch of the tool it follows (origin/main when not given).
self = yes
# yes: the checkout of the project follows its base ([lanes] base) the same
# way (project-update.sh): what went live in the project, its settings and
# prompts for this tool among it, is read from the next wake on.
project = yes

[harness]
# The other harness a role's work may go to, by what is left of each
# subscription ([limits] subscription_switch and subscription_stop): the
# alias of a model of another adapter. A role that is not named here always
# runs where [roles] and [rules] say (the lead, which acts on the host, and
# the write-ups). A model named for one lane (--model) is never changed.
dev        = codex-heavy
mechanical = sonnet-5.5

[lanes]
# Where the dispatcher creates its worktrees, and from which ref.
root = ~/work/my-project-lanes/my-project
base = origin/main
# Roles whose lane is pushed, and its pull request opened, by push-lane.sh
# once its run is done. A lane has no network command of its own.
push_roles = dev mechanical talk
# The lanes are tidied by rule once a day (tidy-lanes.sh, from the first wake
# after tidy_hour, local time; rule of the user, 2026-10-08). A lane is
# closed when the pull request of its branch is merged or closed, when
# nothing happened in it for idle_hours and no open ticket is attached to
# it, when it is a trial (its branch starts with one of trial_prefixes), or
# when it only waits for his agreement (a ticket attached to it is in
# validate_state or go_state): its branch is on the remote, and a lane is
# opened again only if a review asks for a correction. Never when a ticket
# attached to it is at work (busy_states). A ticket is open unless in
# closed_states.
# What exists only in a worktree is archived under archives (in the main
# checkout) before it goes. The reasons and the summary are the words kept
# for the digest.
# A ticket counts as his « go » when he put it in [linear] todo_state at or
# after this moment, the one he gave the rule (« un ticket passé en Todo par
# moi vaut vas-y », 2026-10-08): what sat there before waits for him to put
# it there again.
todo_since = 2026-10-08T06:01:00Z
# A lane is not opened again more than this many times in a day (red checks,
# corrections asked for, a word of the user): beyond, it is said to the lead
# and left as it is. The rule against loops comes first: three runs a day for
# one kind of reason (the checks, a reviewer, the base, a session that
# stopped, work that would not leave); a word of the user or of the lead is
# never a loop. This is the net under it.
runs_per_day = 12
# A session of a lane that runs for longer than this many hours is stopped;
# it counts as a session that stopped short.
session_hours = 6
# The base that moved on code is brought into the branch of a lane by the
# rules themselves when git merges it with nothing to decide: no session, no
# model; the checks then run on the result like on any push. A conflict
# opens the lane. no: a session of the lane brings it in every time.
base_without_model = yes
# A check the runner broke, not the lane: the steps of the workflow (by
# their names, separated by commas) whose failure is the machine's (an
# install, a checkout). When every step that failed on a version is one of
# them, its checks are started again once, when the host is free, instead
# of a session of a model that has nothing to correct. Empty: never.
rerun_steps =
# What a lane sets apart for the user in its worktree (kept_from, a folder
# git ignores) is kept under its ticket in kept_in when its worktree is
# closed: a capture exists nowhere else, and the lead needs it to ask for
# an agreement on a screen. kept_in/<ticket> is one of [linear] capture_roots.
kept_from = .local/captures-linear
kept_in = ~/work/my-project/.local/captures-linear
# The heavy commands of a lane (screen tests, captures): run only through
# when-free.sh, when the host is free for them and one at a time. A lane
# cannot see what the host is doing.
heavy_commands = npm run test:ui, npm run capture:all, npm run capture:landing, ~/work/my-project/scripts/codex-task.sh
heavy_wait_minutes = 30
tidy_hour = 6
idle_hours = 24
trial_prefixes = test/, essai/
busy_states = In Progress
closed_states = Done, Canceled, Duplicate
archives = .local/lane-archives
tidy_reason_live = changement en ligne
tidy_reason_idle = sans activité depuis un jour, aucun ticket ouvert
tidy_reason_trial = équipe d'essai
tidy_reason_waiting = n'attend plus que ton accord
tidy_summary = %s équipe(s) restante(s), %s session(s) de modèle encore vivante(s) sur le serveur.

[linear]
team = ABC
# Role that words the Linear comment of a lane from its report, and the roles
# whose report is reworded. The others are posted as written: a review cut
# down to fifteen lines would lose findings.
writeup_role = writing
writeup_for  = dev mechanical release triage cleanup
# The user reads every comment: all the agents together post no more than this
# many an hour. Beyond, linear.sh refuses, and what there is to say is grouped
# in one comment, later. (Rule of the user, 2026-10-07; the lanes have the
# same limit: [lead] messages_per_lane_per_hour.)
comments_per_hour = 6
# Who the user is, for the tracker: its identifier of his account. The
# scripts act under the name of the application of the agents, so « the owner
# of the key » no longer is him: a move of a card counts as his agreement
# only when it comes from this account.
owner_id = 00000000-0000-0000-0000-000000000000
# The statuses of the user's agreement to a go-live (his rule of 2026-10-08).
# A script puts a ticket in validate_state, with its request, and in
# done_state once it is live. go_state is his alone: no script sets it.
validate_state = À valider
go_state       = Go MEP
done_state     = Done
# The statuses that say where the work stands, which a script may set: a lane
# is at work on the ticket; its work is being checked (review, checks).
progress_state = In Progress
review_state   = In Review
# The status by which the user says « go » on a ticket: a lane is opened on a
# ticket he put there himself (flow-lanes.sh). Without it, nothing opens by
# itself.
todo_state     = Todo
# The only folders from which an image may be sent to Linear with a request
# (linear.sh upload): the one a lane sets apart, in its worktree, for the
# screenshots it took on the demonstration data. * is one folder name. The
# rest of a worktree (test results, images of the repository, a capture
# taken on real data) never leaves.
capture_roots = ~/work/my-project/.local/captures-linear, ~/work/my-project/.local/captures-linear/*, ~/work/my-project-lanes/my-project/*/.local/captures-linear

[permissions.dev]
# What a lane of this role may do without a screen. mode: read-only or
# accept-edits (file edits in its worktree). allow: the only commands it may
# run, as prefixes. deny: refused even if a prefix above would let them
# through. Never a network command, never docker (decision of 2026-10-07).
# This is a rule given to the CLI, not a sandbox: a test it is allowed to run
# is still code. Two kinds of command stay out of the list: a wrapper that
# runs whatever follows it, and anything that touches git state shared by
# every worktree (stash, switching, creating, moving or deleting branches,
# rewriting history). {orch} stands for the folder of these scripts as the
# dispatcher runs them: a lane is handed that copy, not the one of its branch.
mode  = accept-edits
allow = npm test, npm run test:calculations, npm run test:dates, npm run test:docs, npm run test:mutations, {orch}/when-free.sh, npm run check, npm run build, node --test, node scripts/with-test-postgres.mjs -- node --test, git status, git diff, git log, git show, git add, git commit, git restore, git merge, git rev-parse, git ls-files, git blame
deny  = curl, wget, ssh, scp, nc, docker, npm run docker:up, npm install, npm ci, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh, npm run test:ui, npm run capture:all, npm run capture:landing

[permissions.mechanical]
# Same limits as dev when a mechanical task ends up on a CLI that runs on the
# host. (Codex is isolated by its own container instead.)
mode  = accept-edits
allow = npm test, npm run test:calculations, npm run test:dates, npm run test:docs, npm run test:mutations, npm run test:ui, npm run check, npm run build, node --test, node scripts/with-test-postgres.mjs -- node --test, git status, git diff, git log, git show, git add, git commit, git restore, git merge, git rev-parse, git ls-files, git blame
deny  = curl, wget, ssh, scp, nc, docker, npm run docker:up, npm install, npm ci, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[permissions.release]
# The project lead reads. What it decides is carried out by scripts, not by
# commands of its own.
mode  = read-only
# The lead coordinates: it runs without the helper model of the CLI, which
# cost twice what the lead did itself in its first session on this model
# (2026-10-07, agreed by the user).
advisor = no
allow = git status, git diff, git log, git show, git rev-parse, git ls-files
deny  = curl, wget, ssh, scp, nc, docker, npm, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[permissions.release-live]
# The acting project lead, first step: it answers. In Linear (linear.sh
# comment, which runs every text through the guard), and to the lanes already
# at work (tell-lane.sh, in their own terminal). host-state.sh tells it
# whether the host is free. It reads what the user wrote in Linear (comments,
# issue, waiting): his agreements are there, and it has no memory of its own.
# Second step: it opens the review of a pull request (review-pr.sh, which
# opens one review lane by rules of its own and closes the one before). It
# opens no other lane. Third step: it asks the user for his agreement to a
# go-live (ask-validation.sh) and puts a pull request live with merge-pr.sh,
# which checks every condition itself and judges nothing. It never changes a
# status by any other way. Since 2026-10-08 it opens a ticket for one thing,
# a night check that came out red (linear.sh create, rule of the user), and
# keeps a note for the digest (digest-note.sh). It closes no lane: the daily
# tidying runs by rule, without it.
mode  = read-only
# What the lanes set apart for the user (their captures) is kept outside its
# worktree: it reads that folder, to show a screen with the request for his
# agreement.
read  = {kept}
# The lead coordinates: it runs without the helper model of the CLI, which
# cost twice what the lead did itself in its first session on this model
# (2026-10-07, agreed by the user).
advisor = no
allow = {orch}/linear.sh comment, {orch}/linear.sh create, {orch}/digest-note.sh, {orch}/linear.sh comments, {orch}/linear.sh issue, {orch}/linear.sh waiting, {orch}/tell-lane.sh, {orch}/host-state.sh, {orch}/review-pr.sh, {orch}/ask-validation.sh, {orch}/merge-pr.sh, git status, git diff, git log, git show, git rev-parse, git ls-files
deny  = {orch}/linear.sh move, *--output*, *--no-index*, curl, wget, ssh, scp, nc, docker, npm, npx, gh, orca, git push, git fetch, git pull, git clone, git remote, {orch}/tidy-lanes.sh, {orch}/spawn-lane.sh, {orch}/kill-lane.sh, {orch}/push-lane.sh, {orch}/adopt-lane.sh, {orch}/confirm-decision.sh

[talk]
# The discussion mode: talk.sh opens one interactive session in the lane of
# the lead, with the model of this role and a briefing gathered by scripts.
# It has no right to act. Its one way to write is to propose, with decide.sh,
# a decision the user worded; nothing leaves until the user confirms it
# himself (confirm-decision.sh): ledger (source discussion), Linear, and
# docs/decisions.md through a draft pull request of the branch
# <role>/<[lead] report_on>. While a discussion is open, the short sessions
# of the lead wait: never two agents in the same folder.
role = talk

[permissions.talk]
# Nothing is asked for at the screen: what is not named here is refused. No
# linear.sh comment nor create, and no confirm-decision.sh: the session
# proposes a decision with decide.sh, the user alone confirms it. No
# tell-lane.sh beyond its list. Of git, only what reads the history of the
# repository; never an option that writes a file or reads one outside it.
mode  = read-only
allow = {orch}/decide.sh, {orch}/linear.sh issue, {orch}/linear.sh comments, {orch}/linear.sh list, {orch}/linear.sh waiting, {orch}/host-state.sh, {orch}/tell-lane.sh --list, git status, git log, git show, git ls-files
deny  = *--output*, *--no-index*, curl, wget, ssh, scp, nc, docker, npm, npx, gh, orca, git push, git fetch, git pull, git clone, git remote, git commit, git merge, git reset, git checkout, {orch}/confirm-decision.sh, {orch}/linear.sh comment, {orch}/linear.sh create, {orch}/spawn-lane.sh, {orch}/kill-lane.sh, {orch}/push-lane.sh, {orch}/adopt-lane.sh, {orch}/talk.sh, {orch}/wake.sh

[permissions.review]
mode  = read-only
allow = git status, git diff, git log, git show, git rev-parse, git ls-files, git blame
deny  = *--output*, *--no-index*, curl, wget, ssh, scp, nc, docker, npm, npx, gh, git push, git fetch, git pull, git clone, git remote, {orch}/confirm-decision.sh

[adapter.claude]
# npm package of the CLI, for the weekly check of its version.
package    = @anthropic-ai/claude-code
# Lanes do not load the connectors of the user (Linear, mail…): they talk to
# Linear through linear.sh only, and a connector is a network tool.
connectors = none
# Name of its process on the host, to count the sessions still alive.
process    = claude
# Tools of the CLI that reach the network, refused whenever a role has a
# permissions section.
deny_tools = WebFetch WebSearch

[adapter.codex]
package     = @openai/codex
process     = codex
# Codex never runs on the host: this trusted script (main checkout) runs it
# in a container that only sees a guarded snapshot of the commit.
task_script = ~/work/my-project/scripts/codex-task.sh
# yes: the work of a lane runs with the means of any other lane inside that
# container (the script's --tools: the dependencies, a browser, a database,
# its screenshots), through the door of the heavy commands for the whole
# session: the script must be one of [lanes] heavy_commands.
task_tools  = yes
# no: this backend cannot commit (its work comes back as changes applied to
# the worktree): lane-run.sh commits it, under the message it wrote.
commits     = no

[dashboard]
# Times on the page are written in this zone (the page has no script).
timezone       = UTC
timezone_label = UTC
# A subscription is flagged when it ends within this many days.
warn_days      = 10

[subscriptions]
# name = end date (YYYY-MM-DD). Shown with the days left on the dashboard and
# recalled by the daily digest. Empty = end date not known; "ongoing" = runs
# until cancelled, no end date.
codex  = 2026-10-16
claude = ongoing

[prices]
# USD per million tokens: input, output, cache read, cache write 5 min,
# cache write 1 h. Used when the CLI does not report a cost itself (old
# session logs). No line = no cost computed, never a guess.
# The 1 h write rate was checked against the cost reported by the CLI on
# 2026-10-07; the 5 min rate is the list rate (1.25 x input).
claude-haiku-4-5-20251001 = 1 5 0.10 1.25 2
claude-sonnet-5-5         = 2 10 0.20 2.5 4
claude-opus-5-5           = 4 20 0.20 5 8
claude-fable-5-1          = 10 50 0.25 12.5 20

[currency]
# Euros for one US dollar. ECB reference rate of 2026-10-06 (1 EUR = 1.1269 USD).
usd_eur = 0.8874
